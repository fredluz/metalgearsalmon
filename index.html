<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-store, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Whisker Intrusion</title>
    <link id="appStyles" rel="stylesheet" href="styles.css">
    <script>
      window.__BUILD_ID__ = new URLSearchParams(window.location.search).get("v") || "guard-barks-20260426";
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("appStyles").href = `styles.css?v=${encodeURIComponent(window.__BUILD_ID__)}`;
        document.getElementById("buildBadge").textContent = `Build ${window.__BUILD_ID__}`;
      });
    </script>
  </head>
  <body>
    <main class="shell">
      <section class="hud" aria-label="Mission status">
        <div>
          <p class="eyebrow">Tactical Espionage Cat</p>
          <h1>Whisker Intrusion</h1>
        </div>
        <div class="status-grid">
          <div>
            <span>Room</span>
            <strong id="roomLabel">Kennel Gate</strong>
          </div>
          <div>
            <span>Gear</span>
            <strong id="keyLabel">Lost</strong>
          </div>
          <div>
            <span>Alert</span>
            <strong id="alertLabel">Clear</strong>
          </div>
          <div>
            <span>Lure</span>
            <strong id="gadgetLabel">Ready</strong>
          </div>
        </div>
      </section>

      <section class="game-frame" aria-label="Whisker Intrusion game">
        <canvas id="game" width="960" height="640" aria-label="Top-down stealth cat game"></canvas>
        <div id="message" class="message" hidden></div>
      </section>

      <section class="controls" aria-label="Controls">
        <span><kbd>WASD</kbd> or <kbd>Arrows</kbd> move</span>
        <span><kbd>Shift</kbd> pad softly</span>
        <span><kbd>C</kbd> box cover</span>
        <span><kbd>Q</kbd> yarn toss</span>
        <span><kbd>F</kbd> whisker sense</span>
        <span><kbd>Space</kbd> meow lure</span>
        <span><kbd>X</kbd> use ration</span>
        <span><kbd>E</kbd> scratch / boat / collect</span>
        <span><kbd>P</kbd> pause</span>
        <span><kbd>R</kbd> restart / confirm</span>
      </section>
      <p class="build-badge" id="buildBadge">Build guard-barks-20260426</p>
    </main>
    <script>
      const appScript = document.createElement("script");
      appScript.src = `game.js?v=${encodeURIComponent(window.__BUILD_ID__)}`;
      document.body.appendChild(appScript);
    </script>
  </body>
</html>
